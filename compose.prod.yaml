# DOCKER PROD FILE
# docker compose -f compose.prod.yaml build --no-cache
# docker compose -f compose.prod.yaml up --force-recreate --build

networks:
  matli_network:
    name: matli_network

services:
  # Наружу опубликован только nginx. Сервисы верят заголовкам X-User-*, которые ставит
  # nginx после проверки токена (nginx/njs/auth.js), — открытый порт сервиса дал бы
  # подделать их мимо nginx. Друг к другу сервисы ходят по именам внутри сети compose
  # (calc-server -> dictionary-server), ports для этого не нужны; expose — только пометка,
  # какой порт слушает контейнер. В compose.dev.yaml порты открыты намеренно — для отладки.
  calc-server:
    image: dmprkp/calc-server:latest
    expose:
      - 4000
    env_file:
      - ./secrets/calc-db/.db.env
    environment:
      - DB_HOST=host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"

  order-server:
    build:
      context: ./order-server
      dockerfile: ./docker/Dockerfile.prod
    expose:
      - 4100
    env_file:
      - ./secrets/order-db/.db.env
    environment:
      - DB_HOST=host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./order-server/static:/usr/order-server/static

  user-server:
    build:
      context: ./user-server
      dockerfile: ./docker/Dockerfile.prod
    expose:
      - 4200
    env_file:
      - ./secrets/user-db/.db.env
      - ./secrets/jwt/.jwt.env
    environment:
      - DB_HOST=host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"

  dictionary-server:
    build:
      context: ./dictionary-server
      dockerfile: ./docker/Dockerfile.prod
    expose:
      - 4300
    env_file:
      - ./secrets/dict-db/.db.env
    environment:
      - DB_HOST=host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"

  warehouse-server:
    build:
      context: ./warehouse-server
      dockerfile: ./docker/Dockerfile.prod
    expose:
      - 4400
    env_file:
      - ./secrets/warehouse-db/.db.env
    environment:
      - DB_HOST=host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"

  company-server:
    build:
      context: ./company-server
      dockerfile: ./docker/Dockerfile.prod
    expose:
      - 4500
    env_file:
      - ./secrets/company-db/.db.env
    environment:
      - DB_HOST=host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"

  ionic-client:
    build:
      context: ./ionic-client
      dockerfile: ./docker/Dockerfile.prod
    expose:
      - 5173

  # Админка разработчика — осознанное исключение из «наружу только nginx»: свой порт,
  # снаружи закрыт роутером (сервер в домашней сети), внутри пускает только ADMIN
  # (admin-server спрашивает user-server). X-User-* она не принимает, поэтому открытый
  # порт не даёт подделать пользователя, как дал бы порт сервиса.
  admin-server:
    build:
      context: ./admin-server
      dockerfile: ./docker/Dockerfile.prod
    expose:
      - 4600
    env_file:
      - ./secrets/admin-db/.db.env
    environment:
      - DB_HOST=host.docker.internal
      - USER_SERVER_URL=http://user-server:4200/user/api/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - user-server

  admin-client:
    build:
      context: ./admin-client
      dockerfile: ./docker/Dockerfile.prod
    ports:
      - "8090:80"
    depends_on:
      - admin-server

  nginx:
    # Токен user-server проверяет nginx (nginx/njs/auth.js) и передаёт сервисам X-User-*.
    # Секрет, кроме него, знает только user-server — он токены выпускает.
    env_file:
      - ./secrets/jwt/.jwt.env
    volumes:
      - ./nginx/certs:/etc/letsencrypt
      - ./nginx/logs:/var/log/nginx
    build:
      context: ./nginx
      dockerfile: ./Dockerfile.prod
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - ionic-client
      - calc-server
      - order-server
      - user-server
      - dictionary-server
      - warehouse-server
      - company-server
