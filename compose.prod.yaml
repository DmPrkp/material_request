# DOCKER PROD FILE
# docker compose -f compose.prod.yaml build --no-cache
# docker compose -f compose.prod.yaml up --force-recreate --build

# Секреты — один файл .env в корне (в .gitignore, ключи — .env.example). Compose читает его сам
# для подстановок ${...}, а сервис получает только перечисленное у него в environment: nginx,
# который смотрит в интернет, не знает пароля базы, а сервисы за ним — секрета JWT.
x-db-env: &db-env
  DB_HOST: db
  DB_PORT: "5432"
  POSTGRES_USER: ${POSTGRES_USER:?нет в .env}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?нет в .env}

# Сеть у стека одна — та, что compose заводит сам (<проект>_default): сервисы её не
# перечисляют, а объявленная здесь раньше matli_network никем не использовалась и поэтому
# не создавалась вовсе (на сервере жила material_request_default). Настраиваем именно default,
# иначе правка молча ни на что не влияет.
#
# IPv6 выключен намеренно. Демон на сервере раздаёт сетям адреса fdd0::/8, и docker DNS
# отдавал на каждое имя и AAAA, и A. Внутри же IPv6 никто не слушает: у сервисов
# app.listen(PORT, '0.0.0.0'), у клиента listen 5173. Главный nginx шёл сначала по IPv6,
# получал Connection refused, помечал адрес нерабочим на fail_timeout и уходил на IPv4 —
# сайт работал, но logs/nginx.log забивался парами error+warn, и настоящие 502 в них тонули.
# Снаружи это ничего не меняет: IPv6-посетители приходят на порт хоста.
networks:
  default:
    enable_ipv6: false

services:
  # Наружу опубликован только nginx. Сервисы верят заголовкам X-User-*, которые ставит
  # nginx после проверки токена (nginx/njs/auth.js), — открытый порт сервиса дал бы
  # подделать их мимо nginx. Друг к другу сервисы ходят по именам внутри сети compose
  # (calc-server -> dictionary-server), ports для этого не нужны; expose — только пометка,
  # какой порт слушает контейнер. В compose.dev.yaml порты открыты намеренно — для отладки.
  calc-server:
    restart: unless-stopped
    # Собирается из исходников, как остальные сервисы, а не тянется образом с Docker Hub:
    # с образом прод отставал от кода — на сервер уезжал последний запушенный latest,
    # а не то, что деплоят. Код calc-server версионируется отдельно и в git этого
    # репозитория не лежит, поэтому deploy.sh заливает его отдельным rsync.
    build:
      context: ./calc-server
      dockerfile: ./docker/Dockerfile.prod
    expose:
      - 4000
    environment:
      <<: *db-env
      POSTGRES_DB: calc
      LOG_DIR: /var/log/matli
    # Лог ошибок сервиса — в общий logs/ на хосте (src/common/error-log.ts).
    volumes:
      - ./logs:/var/log/matli
    depends_on:
      db:
        condition: service_healthy

  order-server:
    restart: unless-stopped
    build:
      context: ./order-server
      dockerfile: ./docker/Dockerfile.prod
    expose:
      - 4100
    environment:
      <<: *db-env
      POSTGRES_DB: order
      # Лог ошибок в файл на хосте: stderr контейнера достаётся только через sudo docker logs,
      # и надо заранее знать, в каком из сервисов смотреть (src/common/error-log.ts).
      LOG_DIR: /var/log/matli
    volumes:
      - ./logs:/var/log/matli
    depends_on:
      db:
        condition: service_healthy

  user-server:
    restart: unless-stopped
    build:
      context: ./user-server
      dockerfile: ./docker/Dockerfile.prod
    expose:
      - 4200
    environment:
      <<: *db-env
      POSTGRES_DB: user
      LOG_DIR: /var/log/matli
      JWT_SECRET: ${JWT_SECRET:?нет в .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-}
      DEFAULT_ADMIN_LOGIN: ${DEFAULT_ADMIN_LOGIN:-}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-}
      DEFAULT_ADMIN_FIRST_NAME: ${DEFAULT_ADMIN_FIRST_NAME:-}
      # Из него собираются ссылки в письмах; должен совпадать с APP_URL у mail-server.
      APP_URL: ${APP_URL:-https://zayavka.app}
    # Лог ошибок сервиса — в общий logs/ на хосте (src/common/error-log.ts).
    volumes:
      - ./logs:/var/log/matli
    depends_on:
      db:
        condition: service_healthy

  dictionary-server:
    restart: unless-stopped
    build:
      context: ./dictionary-server
      dockerfile: ./docker/Dockerfile.prod
    expose:
      - 4300
    environment:
      <<: *db-env
      POSTGRES_DB: dictionary
      LOG_DIR: /var/log/matli
    # Лог ошибок сервиса — в общий logs/ на хосте (src/common/error-log.ts).
    volumes:
      - ./logs:/var/log/matli
    depends_on:
      db:
        condition: service_healthy

  warehouse-server:
    restart: unless-stopped
    build:
      context: ./warehouse-server
      dockerfile: ./docker/Dockerfile.prod
    expose:
      - 4400
    environment:
      <<: *db-env
      POSTGRES_DB: warehouse
      LOG_DIR: /var/log/matli
    # Лог ошибок сервиса — в общий logs/ на хосте (src/common/error-log.ts).
    volumes:
      - ./logs:/var/log/matli
    depends_on:
      db:
        condition: service_healthy

  company-server:
    restart: unless-stopped
    build:
      context: ./company-server
      dockerfile: ./docker/Dockerfile.prod
    expose:
      - 4500
    environment:
      <<: *db-env
      POSTGRES_DB: company
      LOG_DIR: /var/log/matli
    # Лог ошибок сервиса — в общий logs/ на хосте (src/common/error-log.ts).
    volumes:
      - ./logs:/var/log/matli
    depends_on:
      db:
        condition: service_healthy

  mail-server:
    restart: unless-stopped
    # Своей базы нет, поэтому нет ни db-env, ни depends_on на базу. Наружу не смотрит:
    # в nginx не заведён и порт не опубликован — иначе письма от подтверждённого домена
    # zayavka.app мог бы слать кто угодно.
    build:
      context: ./mail-server
      dockerfile: ./docker/Dockerfile.prod
    expose:
      - 4700
    environment:
      LOG_DIR: /var/log/matli
      # Доступы к релею (SMTP.bz) — только этому сервису, как JWT_SECRET только user-server.
      MAIL_HOST: ${MAIL_HOST:?нет в .env}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USER: ${MAIL_USER:?нет в .env}
      MAIL_PASSWORD: ${MAIL_PASSWORD:?нет в .env}
      MAIL_FROM: ${MAIL_FROM:-noreply@zayavka.app}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}
      APP_URL: ${APP_URL:-https://zayavka.app}
    # Лог ошибок сервиса — в общий logs/ на хосте (src/common/error-log.ts).
    volumes:
      - ./logs:/var/log/matli

  ionic-client:
    restart: unless-stopped
    build:
      context: ./ionic-client
      dockerfile: ./docker/Dockerfile.prod
    expose:
      - 5173

  # Админка разработчика — осознанное исключение из «наружу только nginx»: свой порт,
  # снаружи закрыт роутером (сервер в домашней сети), внутри пускает только ADMIN
  # (admin-server спрашивает user-server). X-User-* она не принимает, поэтому открытый
  # порт не даёт подделать пользователя, как дал бы порт сервиса.
  admin-server:
    restart: unless-stopped
    build:
      context: ./admin-server
      dockerfile: ./docker/Dockerfile.prod
    expose:
      - 4600
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      ADMIN_DB_USER: ${ADMIN_DB_USER:-}
      ADMIN_DB_PASSWORD: ${ADMIN_DB_PASSWORD:-}
      USER_SERVER_URL: http://user-server:4200/user/api/v1
      # Лог ошибок всех сервисов — страница «Лог ошибок». Не LOG_DIR: так сервисы зовут
      # каталог, куда пишут, а админка только читает (монтирование :ro).
      ERROR_LOGS_DIR: /var/log/matli
    volumes:
      - ./logs:/var/log/matli:ro
    depends_on:
      db:
        condition: service_healthy
      user-server:
        condition: service_started

  admin-client:
    restart: unless-stopped
    build:
      context: ./admin-client
      dockerfile: ./docker/Dockerfile.prod
    ports:
      - "8090:80"
    depends_on:
      - admin-server

  nginx:
    restart: unless-stopped
    # Токен user-server проверяет nginx (nginx/njs/auth.js) и передаёт сервисам X-User-*.
    # Секрет, кроме него, знает только user-server — он токены выпускает.
    environment:
      JWT_SECRET: ${JWT_SECRET:?нет в .env}
    # Сертификаты пишет сервис certbot, nginx только читает; acme — его файлы проверок.
    volumes:
      - ./nginx/certs:/etc/letsencrypt:ro
      - ./nginx/acme:/var/www/certbot:ro
      - ./nginx/logs:/var/log/nginx
      # Второй error_log — в общий каталог поломок (main.conf). Без этой строки
      # nginx не поднимется: путь из конфига обязан существовать.
      - ./logs:/var/log/matli
    build:
      context: ./nginx
      dockerfile: ./Dockerfile.prod
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - ionic-client
      - calc-server
      - order-server
      - user-server
      - dictionary-server
      - warehouse-server
      - company-server

  # Выпуск и продление сертификата Let's Encrypt (nginx/ssl/certbot-loop.sh). Первый
  # сертификат появится через минуты после старта, до того nginx отдаёт самоподписанный;
  # подхватывает новый nginx сам (nginx/ssl/40-ssl-cert.sh). Нужен открытый наружу порт 80.
  certbot:
    restart: unless-stopped
    image: certbot/certbot:v5.8.0
    environment:
      SSL_DOMAIN: zayavka.app
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-}
    volumes:
      - ./nginx/certs:/etc/letsencrypt
      - ./nginx/acme:/var/www/certbot
      - ./nginx/ssl/certbot-loop.sh:/certbot-loop.sh:ro
    entrypoint: ["/bin/sh", "/certbot-loop.sh"]
    depends_on:
      - nginx

  # База — в этом же compose, а не приложением TrueNAS: та же версия, что в dev, db/init
  # заводит базы и read-only роль админки сам, а сервисы ходят к ней по сети compose —
  # порт 5432 на хосте не публикуется.
  db:
    restart: unless-stopped
    # Версия закреплена намеренно: с незакреплённым postgres очередной pull приносит
    # новую мажорную версию, которая не читает старый каталог данных.
    image: postgres:18-alpine
    # Владелец баз — тот же POSTGRES_USER, под которым ходят сервисы; POSTGRES_DB — база
    # calc-server, остальные заводит db/init. ADMIN_DB_* — для 02-admin-readonly.sh.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?нет в .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?нет в .env}
      POSTGRES_DB: calc
      ADMIN_DB_USER: ${ADMIN_DB_USER:-}
      ADMIN_DB_PASSWORD: ${ADMIN_DB_PASSWORD:-}
    # 64 МБ по умолчанию у docker мало: параллельные запросы падают на resize shared memory.
    shm_size: 256mb
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      # Данные — в датасете ZFS, а не в именованном томе: том лежит в хранилище docker
      # (/mnt/.ix-apps/docker), которое уже ломалось, а у датасета свои снапшоты.
      # postgres 18+ ждёт монтирование каталогом выше, а не в /data. Каталог на хосте —
      # владелец 70:70 (postgres в alpine), иначе entrypoint не пройдёт в него после смены пользователя.
      - ${PGDATA_DIR:-/mnt/tank/postgres}:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
