# Статика админки и прокси к admin-server. Токен здесь не проверяется: это делает
# сам admin-server вопросом к user-server (auth.guard.ts), X-User-* админке не нужны.
server {
    listen 80;

    # Адрес admin-server спрашиваем у DNS докера на каждый запрос (раз в 10 с), а не один раз
    # на старте: деплой пересоздаёт admin-server с новым IP, а admin-client с тем же образом
    # не трогает — и nginx ходил на мёртвый адрес, отдавая 502, пока его не перезапустят.
    # Переменная в proxy_pass — то, что заставляет nginx резолвить в рантайме.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 2s;
    set $admin_server admin-server:4600;

    location /admin/api/ {
        proxy_pass http://$admin_server;
        proxy_set_header Host $host;
    }

    # История vue-router: любой путь, кроме файла, — index.html.
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
