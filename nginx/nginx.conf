# Конфиг сайта, общий для обеих сред. Различаются они только головой server-блока —
# она приходит из snippets/listen.conf, который Dockerfile кладёт свой на каждую среду
# (nginx/listen/{dev,prod}.conf). На проде рядом ещё http-redirect.conf с 80-м портом.
server {
    # Порт, сертификаты и HSTS — единственное, чем среды отличаются.
    include /etc/nginx/snippets/listen.conf;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Адреса апстримов спрашиваем у DNS докера в рантайме (раз в 10 с), а не один раз на старте:
    # сервис, перезапущенный деплоем или после рестарта докера, получает новый IP, а nginx,
    # которого не трогали, продолжал ходить на старый и отдавал 502, пока его не перезапустят.
    # Резолвит в рантайме только proxy_pass с переменной — отсюда set на каждый сервис.
    # Заодно nginx больше не падает на старте, если какого-то апстрима нет: будет 502 на его
    # location-ах, а не лежащий сайт. Так же сделано у ionic-client (SSI статей) и в админке.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 2s;
    set $up_calc calc-server:4000;
    set $up_order order-server:4100;
    set $up_ai ai-server:4800;
    set $up_telegram telegram-server:4900;
    set $up_user user-server:4200;
    set $up_dictionary dictionary-server:4300;
    set $up_warehouse warehouse-server:4400;
    set $up_company company-server:4500;
    set $up_client ionic-client:5173;

    # Прокси к разным сервисам. Для анонима и в location-ах без gateway-auth.conf
    # (user-server, клиент) X-User-* затираются: иначе клиент прислал бы их сам.
    proxy_set_header X-User-Id "";
    proxy_set_header X-User-Role "";

    # Буферы под ответ апстрима. По умолчанию их 8 по 4k = 32k, а главный бандл клиента —
    # около 1 МБ (сжатый ~250 КБ), поэтому nginx складывал его во временный файл на диске и
    # писал об этом warn в общий лог поломок. 8 по 128k хватает на бандл целиком даже
    # несжатым; память берётся только на время ответа, а не на каждое соединение.
    proxy_buffer_size 32k;
    proxy_buffers 8 128k;
    proxy_busy_buffers_size 256k;

    location /calc/api/v1/ {
        include /etc/nginx/snippets/gateway-auth.conf;
        proxy_pass http://$up_calc;
    }

    location /order/api/v1/ {
        include /etc/nginx/snippets/gateway-auth.conf;
        proxy_pass http://$up_order;
    }

    # Ассистент действует от имени вошедшего, поэтому gateway-auth обязателен: аноним получит 401.
    # Ответ модели с вызовами инструментов бывает дольше обычных 60 с.
    location /ai/api/v1/ {
        include /etc/nginx/snippets/gateway-auth.conf;
        proxy_read_timeout 180s;
        proxy_pass http://$up_ai;
    }

    # Webhook Telegram — единственная ручка telegram-server наружу (отправка `/messages` —
    # только для своих). Входа пользователя тут нет: подлинность проверяет сам сервис по
    # секрету из заголовка. Точное совпадение, чтобы остальное не стало публичным.
    location = /telegram/api/v1/webhook {
        proxy_pass http://$up_telegram;
    }

    location /user/api/v1/ {
        proxy_pass http://$up_user;
    }

    # Лимиты (зоны и обоснование — в main.conf). Регэкспы, а не точные пути, и именно такие:
    # Nest (express) не различает регистр и косую черту в конце, так что «/Auth/Login/» дошёл
    # бы до сервиса мимо точного location. Отдельный proxy_pass в каждом — proxy-настройки
    # наследуются от server, а X-User-* затираются там же, как у соседнего user-server.
    # Входы и проверки токена.
    location ~* ^/user/api/v1/auth/(login|change-password|password/reset|email/verify|telegram(/link)?)/?$ {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://$up_user;
    }

    # После этих ручек уходит письмо — на любой адрес, который прислал аноним.
    # register сюда же: с почтой он шлёт подтверждение.
    location ~* ^/user/api/v1/auth/(register|password/forgot|email/verify-request)/?$ {
        limit_req zone=mail burst=4 nodelay;
        proxy_pass http://$up_user;
    }

    location ~* ^/user/api/v1/users/me/?$ {
        limit_req zone=mail_profile burst=4 nodelay;
        proxy_pass http://$up_user;
    }

    # Ответ nginx на отказ лимита — JSON в стиле Nest, с подсказкой, когда повторить.
    # Заголовки безопасности из server сюда не наследуются (свой add_header отменяет их),
    # но для JSON-ответа без разметки это не важно.
    error_page 429 @rate_limited;
    location @rate_limited {
        default_type application/json;
        add_header Retry-After 60 always;
        return 429 '{"statusCode":429,"message":"Too Many Requests"}';
    }

    location /dict/api/v1/ {
        include /etc/nginx/snippets/gateway-auth.conf;
        proxy_pass http://$up_dictionary;
    }

    location /warehouse/api/v1/ {
        include /etc/nginx/snippets/gateway-auth.conf;
        proxy_pass http://$up_warehouse;
    }

    location /company/api/v1/ {
        include /etc/nginx/snippets/gateway-auth.conf;
        proxy_pass http://$up_company;
    }

    # Часть sitemap, которую знает только словарь: виды работ и технологии калькулятора
    # (dictionary-server/src/modules/structure/sitemap.ts). /sitemap.xml — индекс, его
    # и статичную часть отдаёт клиент.
    location = /sitemap-technologies.xml {
        proxy_pass http://$up_dictionary/dict/api/v1/sitemap/technologies.xml;
    }

    location / {
        proxy_pass http://$up_client;
    }

    access_log /var/log/nginx/access.log combined;
    # Каталог тот же, что у лога ошибок (./logs, монтирован всегда): отдельный каталог nginx
    # не нашёл бы на старте и не поднялся. Расширение не .log — «Лог ошибок» админки
    # берёт *.log и разбирал бы это как ошибки.
    access_log /var/log/matli/visits.jsonl visits if=$visit_loggable;
}