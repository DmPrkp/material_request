# Кто спрашивает — решает nginx (njs/auth.js), сервисы верят заголовкам X-User-*.
# Подключается в location каждого сервиса, кроме user-server: тот выпускает токены
# и проверяет их сам, а вход с протухшим токеном в заголовке не должен падать 401.

# Битый токен — 401, а не аноним: иначе вошедший молча терял бы своё, а клиент
# не узнал бы, что пора выйти (BaseModel.onUnauthorized). Тело — как у Nest.
if ($auth_status = invalid) {
    return 401 '{"statusCode":401,"message":"Unauthorized"}';
}
# Токен есть, а секрета у nginx нет: чинить надо конфиг (JWT_SECRET в .env), а не вход.
if ($auth_status = unconfigured) {
    return 503 '{"statusCode":503,"message":"JWT_SECRET не задан: вход недоступен"}';
}

# Для ответов nginx выше: у проксированных ответов свой Content-Type.
default_type application/json;

# Пустое значение nginx не шлёт вовсе — так у анонима пропадают и присланные
# клиентом X-User-*, подделать их через nginx нельзя. Задаём оба всегда, даже
# если сервису хватает одного: proxy_set_header в location отменяет наследование.
proxy_set_header X-User-Id $auth_user_id;
proxy_set_header X-User-Role $auth_user_role;
