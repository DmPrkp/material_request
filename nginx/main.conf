# Главный конфиг nginx — штатный из образа nginx:1.25.3 плюс две строки, которые
# можно задать только здесь, в main-контексте, а не в conf.d: модуль njs и доступ к
# JWT_SECRET. Серверы и location-ы — в nginx.conf (он копируется в conf.d/default.conf).

load_module modules/ngx_http_js_module.so;

# nginx по умолчанию вычищает окружение воркеров: без этой строки process.env.JWT_SECRET
# в njs пуст, и любой запрос с токеном получал бы 503.
env JWT_SECRET;

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
# Второй лог, в общий каталог поломок рядом с сервисами (logs/nginx.log на хосте):
# 502 от упавшего апстрима, ошибки njs, отказ сертификата. Уровень warn, а не notice:
# в этом файле ищут поломки, и служебные notice о старте и reload их бы утопили.
# Строка добавочная — error.log выше остаётся как есть, nginx разрешает несколько
# error_log в одном контексте. Каталог обязан существовать в контейнере: без
# монтирования (compose) nginx не стартует. Ротации у nginx своей нет — в отличие от
# сервисов, где её делает src/common/error-log.ts.
error_log  /var/log/matli/nginx.log warn;
pid        /var/run/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    # Статистика посетителей (admin-server/src/visits): строка на запрос в logs/visits.jsonl,
    # admin-server дочитывает его в фоне и сворачивает по IP. JSON, а не combined: User-Agent
    # с кавычками и пробелами combined разбирать ненадёжно, escape=json экранирует сам.
    # Время — ISO с зоной, чтобы не гадать, в каком поясе контейнер.
    log_format  visits  escape=json
                        '{"t":"$time_iso8601","ip":"$remote_addr","ua":"$http_user_agent","u":"$uri","s":"$status"}';

    # Статику не пишем: на счёт заходов она не влияет (их считают по паузам), а файл
    # раздувала бы в десятки раз — страница тянет десятки js/css/картинок. Точные пути
    # важнее регулярок в map, поэтому robots.txt и sitemap (признак робота) остаются.
    # /src/, /node_modules/, /@… — модули dev-сервера Vite, на проде их нет.
    map $uri $visit_loggable {
        /robots.txt          1;
        /sitemap.xml         1;
        ~^/assets/           0;
        ~^/(src|node_modules|@vite|@fs|@id)/  0;
        ~\.(js|mjs|css|map|png|jpe?g|webp|avif|gif|svg|ico|woff2?|ttf|json|txt|xml|webmanifest)$  0;
        default              1;
    }

    # Лимиты по IP на ручки входа и отправки писем (location-ы — в nginx.conf). Зоны только
    # здесь: limit_req_zone в server-контексте не живёт. Ключ — $binary_remote_addr, поэтому
    # он обязан быть настоящим адресом клиента: если за nginx встанет прокси без real_ip,
    # лимит станет общим на всех и положит вход всем сразу.
    #  - auth: перебор пароля и токенов. Человек, промахнувшийся с паролем, укладывается с запасом.
    #  - mail: ручки, после которых уходит письмо (релей с квотой, адрес получателя — любой,
    #    какой пришлёт аноним). Строже на порядок: письмо дороже проверки пароля.
    #  - mail_profile: то же для PATCH /users/me (смена почты шлёт подтверждение); ключ пуст
    #    у всех остальных методов, а пустой ключ nginx не считает.
    # limit_req — это скорость, а не суточная квота: потолок писем в день задаёт rate, и
    # настоящую квоту на адрес/сутки стоит держать в приложении.
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=mail:10m rate=1r/m;
    map $request_method $profile_limit_key {
        PATCH    $binary_remote_addr;
        default  "";
    }
    limit_req_zone $profile_limit_key zone=mail_profile:1m rate=1r/m;
    limit_req_status 429;
    # notice, а не error по умолчанию: error шёл бы в logs/nginx.log (там ищут поломки), и
    # перебор забил бы его отказами. Отказ виден и так — статус 429 в visits.jsonl.
    limit_req_log_level notice;

    sendfile        on;

    keepalive_timeout  65;

    # Проверка токена user-server (njs/auth.js). Переменные вычисляются лениво — только
    # в тех location-ах, что подключают snippets/gateway-auth.conf.
    js_path "/etc/nginx/njs/";
    js_import auth.js;
    js_var $auth_checked;
    js_set $auth_status auth.status;
    js_set $auth_user_id auth.userId;
    js_set $auth_user_role auth.userRole;

    include /etc/nginx/conf.d/*.conf;
}
