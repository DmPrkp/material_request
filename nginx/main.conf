# Главный конфиг nginx — штатный из образа nginx:1.25.3 плюс две строки, которые
# можно задать только здесь, в main-контексте, а не в conf.d: модуль njs и доступ к
# JWT_SECRET. Серверы и location-ы — в nginx.conf (он копируется в conf.d/default.conf).

load_module modules/ngx_http_js_module.so;

# nginx по умолчанию вычищает окружение воркеров: без этой строки process.env.JWT_SECRET
# в njs пуст, и любой запрос с токеном получал бы 503.
env JWT_SECRET;

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
# Второй лог, в общий каталог поломок рядом с сервисами (logs/nginx.log на хосте):
# 502 от упавшего апстрима, ошибки njs, отказ сертификата. Уровень warn, а не notice:
# в этом файле ищут поломки, и служебные notice о старте и reload их бы утопили.
# Строка добавочная — error.log выше остаётся как есть, nginx разрешает несколько
# error_log в одном контексте. Каталог обязан существовать в контейнере: без
# монтирования (compose) nginx не стартует. Ротации у nginx своей нет — в отличие от
# сервисов, где её делает src/common/error-log.ts.
error_log  /var/log/matli/nginx.log warn;
pid        /var/run/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;

    keepalive_timeout  65;

    # Проверка токена user-server (njs/auth.js). Переменные вычисляются лениво — только
    # в тех location-ах, что подключают snippets/gateway-auth.conf.
    js_path "/etc/nginx/njs/";
    js_import auth.js;
    js_var $auth_checked;
    js_set $auth_status auth.status;
    js_set $auth_user_id auth.userId;
    js_set $auth_user_role auth.userRole;

    include /etc/nginx/conf.d/*.conf;
}
