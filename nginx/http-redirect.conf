# Только на проде (кладёт Dockerfile.prod): http → https и проверки Let's Encrypt.
# В dev этого сервера нет — там сайт и так живёт на 80-м, редиректить некуда.
server {
    listen 80;
    server_name zayavka.app;

    # Проверка Let's Encrypt (webroot): файлы кладёт сервис certbot, только по http и без
    # редиректа — иначе ни первый выпуск, ни продление не пройдут.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
