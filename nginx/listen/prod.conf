# Голова server-блока на проде. Подключается из nginx.conf как snippets/listen.conf —
# нужный вариант кладёт Dockerfile (здесь прод, в dev — listen/dev.conf). Так различие
# сред — один маленький файл, а маршруты остаются в nginx.conf общими.
listen 443 ssl;
server_name zayavka.app;

# Симлинк на Let's Encrypt или, пока его нет, на самоподписанный — ssl/40-ssl-cert.sh.
ssl_certificate /etc/nginx/ssl/fullchain.pem;
ssl_certificate_key /etc/nginx/ssl/privkey.pem;

ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers HIGH:!aNULL:!MD5;

# Только здесь: по http HSTS бессмысленен, а в dev он заставил бы браузер ходить на
# localhost по https — и отучить его потом сложно, заголовок запоминается надолго.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
