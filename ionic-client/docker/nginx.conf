# Статика клиента на проде. Раньше её отдавал vite preview — Vite сам пишет, что он не
# для продакшена: ассеты с хешем в имени уходили с Cache-Control: no-cache, и браузер
# перепроверял их на каждом заходе. Перед этим nginx стоит главный (nginx/nginx.conf):
# TLS, заголовки безопасности и API — там, здесь только файлы.
# Локаль для редиректа с корня: выбор пользователя (кука user_locale, её пишет
# plugins/i18n при каждой смене языка), без него — первый язык браузера. Тот же порядок,
# что у resolveInitialLocale на клиенте; незнакомый язык — русский, как DEFAULT_LOCALE.
map $cookie_user_locale $locale_from_cookie {
    ~^(ru|en)$ $1;
    default "";
}
map $http_accept_language $locale_from_browser {
    ~*^en en;
    default ru;
}
map $locale_from_cookie $site_locale {
    "" $locale_from_browser;
    default $locale_from_cookie;
}

server {
    # Порт прежний: главный nginx проксирует на ionic-client:5173.
    listen 5173;
    root /usr/share/nginx/html;

    # Location — относительный: этот nginx за главным, и абсолютный адрес вышел бы
    # внутренним (http://ionic-client:5173/...).
    absolute_redirect off;

    # Корень — на главную на языке пользователя, сервером, а не JS: робот и
    # мессенджер получают редирект без исполнения скриптов. 302 — ответ зависит от
    # языка; Vary — чтобы промежуточный кеш не отдал русский редирект англичанину.
    location = / {
        add_header Vary "Accept-Language, Cookie";
        return 302 /$site_locale/main;
    }

    # /ru и /en без пути — тоже на главную; здесь язык в адресе, ответ постоянный.
    location ~ ^/(ru|en)/?$ {
        return 301 /$1/main;
    }

    # Прежние адреса калькулятора (router/index.ts переводит их тоже, но только JS-ом):
    # они успели попасть в sitemap и индекс, и робот без 301 видел пустую оболочку
    # index.html на каждом — «мягкий 404», дубли без заголовка и canonical.
    location ~ ^/(ru|en)/zayavka/calculator(/.*)?$ {
        return 301 /$1/calculator$2$is_args$args;
    }
    location ~ ^/(ru|en)/main/(.+)$ {
        return 301 /$1/calculator/$2$is_args$args;
    }

    # Главный nginx ходит сюда по HTTP/1.0, а gzip по умолчанию — только для 1.1.
    gzip on;
    gzip_http_version 1.0;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/css application/javascript application/json image/svg+xml
               application/manifest+json text/xml application/xml text/plain;

    # Сборка Vite: имя меняется вместе с содержимым — кешируем навсегда. Нет файла —
    # честный 404, а не index.html: HTML вместо JS-чанка ломал бы загрузку молча.
    # ^~ — чтобы картинки сборки (/assets/*.png) не ушли в regex-блок ниже с кешем на сутки.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Страницы приложения: всё под /ru/ и /en/. <путь>.html — пререндер публичных
    # (seo-prerender.ts), остальное — SPA. no-cache: после деплоя браузер должен сразу
    # получить HTML с новыми ассетами. Разделы роутера здесь не перечисляем — новый
    # роут не требует правки nginx; неизвестный адрес внутри локали рисует роут
    # not-found (noindex), а настоящий 404 получают адреса вне /ru/ и /en/ — туда
    # и приходят сканеры с мусорными URL.
    location ~ ^/(ru|en)/ {
        add_header Cache-Control "no-cache";
        # Текст технологии в HTML страницы: seo-prerender.ts оставляет на его месте
        # SSI-вставку, ниже она берётся из словаря. Словарь не ответил — страница уходит
        # без текста, а не с сообщением nginx об ошибке.
        ssi on;
        ssi_silent_errors on;
        try_files $uri $uri.html /index.html;
    }

    # Текст страницы технологии для SSI (dictionary-server, GET
    # systems/by-title/:title/article/:locale). Только подзапросом: снаружи этого адреса
    # нет. Резолвер и адрес в переменной — чтобы nginx клиента стартовал и без словаря:
    # имя в proxy_pass он резолвит при старте и без апстрима не поднимается. Заголовки
    # посетителя словарю не нужны: текст один для всех, только общие технологии.
    location ~ ^/__article/(?<article_locale>ru|en)/(?<article_code>[A-Za-z0-9_-]+)$ {
        internal;
        resolver 127.0.0.11 valid=30s ipv6=off;
        resolver_timeout 2s;
        set $dictionary http://dictionary-server:4300;
        proxy_pass $dictionary/dict/api/v1/systems/by-title/$article_code/article/$article_locale;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        # SSI вставляет только несжатое тело.
        proxy_set_header Accept-Encoding "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
        # ssi_silent_errors глушит только ошибки самой вставки, а тело ответа с ошибкой
        # (502 от лежащего словаря, 404 на неизвестный код) вставил бы в страницу как есть.
        proxy_intercept_errors on;
        error_page 404 500 502 503 504 = @article_empty;
    }

    location @article_empty {
        return 204;
    }

    # Вне локали — только файлы из public/. Нет файла — index.html с кодом 404: приложение
    # само переведёт на главную, а робот увидит честный 404, а не дубль страницы.
    location / {
        add_header Cache-Control "no-cache";
        error_page 404 /index.html;
        try_files $uri =404;
    }

    # Картинки и иконки из public/ — без хеша в имени, поэтому на сутки, не навсегда.
    location ~* \.(?:png|jpe?g|svg|ico|webp|avif)$ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }
}
