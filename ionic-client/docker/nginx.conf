# Статика клиента на проде. Раньше её отдавал vite preview — Vite сам пишет, что он не
# для продакшена: ассеты с хешем в имени уходили с Cache-Control: no-cache, и браузер
# перепроверял их на каждом заходе. Перед этим nginx стоит главный (nginx/nginx.conf):
# TLS, заголовки безопасности и API — там, здесь только файлы.
server {
    # Порт прежний: главный nginx проксирует на ionic-client:5173.
    listen 5173;
    root /usr/share/nginx/html;

    # Главный nginx ходит сюда по HTTP/1.0, а gzip по умолчанию — только для 1.1.
    gzip on;
    gzip_http_version 1.0;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/css application/javascript application/json image/svg+xml
               application/manifest+json text/xml application/xml text/plain;

    # Сборка Vite: имя меняется вместе с содержимым — кешируем навсегда. Нет файла —
    # честный 404, а не index.html: HTML вместо JS-чанка ломал бы загрузку молча.
    # ^~ — чтобы картинки сборки (/assets/*.png) не ушли в regex-блок ниже с кешем на сутки.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Страницы: <путь>.html — пререндер публичных (seo-prerender.ts), остальное — SPA.
    # no-cache: после деплоя браузер должен сразу получить HTML с новыми ассетами.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html /index.html;
    }

    # Картинки и иконки из public/ — без хеша в имени, поэтому на сутки, не навсегда.
    location ~* \.(?:png|jpe?g|svg|ico|webp|avif)$ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }
}
