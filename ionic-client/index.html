<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>
      Zayávka — Заявки на строительные материалы и калькулятор расхода
    </title>
    <!--
      data-seo — для тех, кто JS не исполняет (превью ссылок в мессенджерах, часть роботов).
      После запуска их убирает router/seo.ts и ставит свои, по странице.
    -->
    <meta
      data-seo
      name="description"
      content="Расчёт материалов, ручного и электроинструмента по технологии работ и заявка для бригады или снабжения. Бесплатно и без регистрации."
    />
    <meta
      data-seo
      property="og:type"
      content="website"
    />
    <meta
      data-seo
      property="og:site_name"
      content="Zayávka"
    />
    <meta
      data-seo
      property="og:title"
      content="Zayávka — Заявки на строительные материалы и калькулятор расхода"
    />
    <meta
      data-seo
      property="og:description"
      content="Расчёт материалов, ручного и электроинструмента по технологии работ и заявка для бригады или снабжения. Бесплатно и без регистрации."
    />
    <meta
      data-seo
      property="og:url"
      content="https://zayavka.app/"
    />
    <meta
      data-seo
      property="og:image"
      content="https://zayavka.app/logo-img.jpg"
    />
    <meta
      data-seo
      property="og:locale"
      content="ru_RU"
    />
    <meta
      data-seo
      name="twitter:card"
      content="summary_large_image"
    />

    <base href="/" />

    <meta
      name="color-scheme"
      content="light dark"
    />
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0"
    />
    <meta
      name="format-detection"
      content="telephone=no"
    />
    <meta
      name="msapplication-tap-highlight"
      content="no"
    />

    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/apple-touch-icon.png"
    />
    <link
      rel="icon"
      href="https://zayavka.app/favicon.ico"
      type="image/x-icon"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/favicon-16x16.png"
    />
    <link
      rel="manifest"
      href="/manifest.json"
    />

    <!-- add to homescreen for ios -->
    <meta
      name="apple-mobile-web-app-capable"
      content="yes"
    />
    <meta
      name="apple-mobile-web-app-title"
      content="Zayávka App"
    />
    <meta
      name="mobile-web-app-capable"
      content="yes"
    />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black"
    />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Zayávka",
        "url": "https://zayavka.app",
        "description": "Калькулятор строительных материалов и инструмента по технологии работ и заявки для бригад",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Any",
        "inLanguage": ["ru", "en"],
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "RUB" }
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Zayávka",
        "url": "https://zayavka.app",
        "logo": "https://zayavka.app/android-chrome-192x192.png",
        "contactPoint": {
          "@type": "ContactPoint",
          "email": "dmprkp@yandex.ru"
        }
      }
    </script>
    <!--
      Оболочка страниц из seo-prerender.ts: видна, пока грузится JS, потом её заменяет
      приложение. Стили Ionic к этому моменту ещё не загружены — только самое нужное.
    -->
    <style>
      .seo-shell {
        max-width: 640px;
        margin: 0 auto;
        padding: 16px;
        font-family: system-ui, sans-serif;
        line-height: 1.5;
      }
      .seo-shell h1 {
        font-size: 1.4rem;
      }
      .seo-shell ul {
        padding-left: 1.2rem;
      }
      .seo-shell a {
        color: inherit;
      }
      @media (prefers-color-scheme: dark) {
        html {
          background: #261935;
          color: #fff;
        }
      }
    </style>
  </head>

  <body>
    <div id="app"></div>
    <script
      type="module"
      src="/src/main.ts"
    ></script>
  </body>
</html>
