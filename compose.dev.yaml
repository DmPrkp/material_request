# DOCKER DEV FILE
# docker compose -f compose.dev.yaml -p matli-dev watch
# docker compose -f compose.dev.yaml -p matli-dev build --no-cache

networks:
  matli_network:
    name: matli_network

services:
  calc-server:
    build:
      context: ./calc-server
      dockerfile: ./docker/Dockerfile.dev
    ports:
      - 4000:4000
    env_file:
      - ./secrets/calc-db/.db.env
      # Запись норм расхода — со входом: токен проверяет сам calc-server, права берёт у словаря.
      - ./secrets/jwt/.jwt.env
    develop:
      watch:
        - action: sync
          path: ./calc-server/src
          target: /usr/calc-server/src
          ignore:
            - node_modules/
            - dist/
        - action: rebuild
          path: ./calc-server/package.json
        - action: rebuild
          path: ./calc-server/tsconfig.json
        - action: rebuild
          path: ./calc-server/nest-cli.json
        - action: rebuild
          path: ./calc-server/docker
    depends_on:
      - db

  order-server:
    build:
      context: ./order-server
      dockerfile: ./docker/Dockerfile.dev
    ports:
      - 4100:4100
    env_file:
      - ./secrets/order-db/.db.env
      # Заявки — по автору: токен проверяет сам order-server.
      - ./secrets/jwt/.jwt.env
    volumes:
      - ./order-server/prisma/migrations:/usr/order-server/prisma/migrations
      - ./order-server/static:/usr/order-server/static
    develop:
      watch:
        - action: sync
          path: ./order-server/src
          target: /usr/order-server/src
          ignore:
            - node_modules/
            - dist/
        - action: rebuild
          path: ./order-server/package.json
        - action: rebuild
          path: ./order-server/tsconfig.json
        - action: rebuild
          path: ./order-server/nest-cli.json
        - action: rebuild
          path: ./order-server/docker
        - action: rebuild
          path: ./order-server/prisma/schema.prisma
    depends_on:
      - db

  user-server:
    build:
      context: ./user-server
      dockerfile: ./docker/Dockerfile.dev
    ports:
      - 4200:4200
    env_file:
      - ./secrets/user-db/.db.env
      - ./secrets/jwt/.jwt.env
    develop:
      watch:
        - action: sync
          path: ./user-server/src
          target: /usr/user-server/src
          ignore:
            - node_modules/
            - dist/
        - action: rebuild
          path: ./user-server/package.json
        - action: rebuild
          path: ./user-server/tsconfig.json
        - action: rebuild
          path: ./user-server/nest-cli.json
        - action: rebuild
          path: ./user-server/docker
        - action: rebuild
          path: ./user-server/prisma/schema.prisma
    depends_on:
      - db

  dictionary-server:
    build:
      context: ./dictionary-server
      dockerfile: ./docker/Dockerfile.dev
    ports:
      - 4300:4300
    env_file:
      - ./secrets/dict-db/.db.env
      - ./secrets/jwt/.jwt.env
    develop:
      watch:
        - action: sync
          path: ./dictionary-server/src
          target: /usr/dictionary-server/src
          ignore:
            - node_modules/
            - dist/
        - action: rebuild
          path: ./dictionary-server/package.json
        - action: rebuild
          path: ./dictionary-server/tsconfig.json
        - action: rebuild
          path: ./dictionary-server/nest-cli.json
        - action: rebuild
          path: ./dictionary-server/docker
        # Новая миграция из db:generate — в образ и на старт контейнера.
        - action: rebuild
          path: ./dictionary-server/drizzle
    depends_on:
      db:
        # именно готовности: миграции стучатся в базу первым делом
        # и без этого падают на ещё не поднявшемся Postgres
        condition: service_healthy

  ionic-client:
    build:
      context: ./ionic-client
      dockerfile: ./docker/Dockerfile.dev
    ports:
      - 5173:5173
    develop:
      watch:
        - action: sync
          path: ./ionic-client
          target: /usr/app
          ignore:
            - node_modules/
    depends_on:
      - db

  nginx:
    build:
      context: ./nginx
      dockerfile: ./Dockerfile.dev
    ports:
      - "80:80"
    depends_on:
      - ionic-client
      - calc-server
      - order-server
      - user-server
      - dictionary-server
      - db

  db:
    # Версия закреплена намеренно: с незакреплённым postgres очередной pull приносит
    # новую мажорную версию, которая не читает старый каталог данных.
    image: postgres:18-alpine
    restart: always
    user: postgres
    environment:
      - POSTGRES_USER=test
      - POSTGRES_PASSWORD=test
      - POSTGRES_DB=calc
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      # postgres 18+ ждёт монтирование каталогом выше, а не в /data
      - matli_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20

  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080
    depends_on:
      - db

volumes:
  matli_pgdata:
