# DOCKER DEV FILE
# docker compose -f compose.dev.yaml -p matli-dev watch
# docker compose -f compose.dev.yaml -p matli-dev build --no-cache

# Секреты — один файл .env в корне (в .gitignore, ключи — .env.example). Compose читает его сам
# для подстановок ${...}, а сервис получает только перечисленное у него в environment: nginx,
# который смотрит в интернет, не знает пароля базы, а сервисы за ним — секрета JWT.
x-db-env: &db-env
  DB_HOST: db
  DB_PORT: "5432"
  POSTGRES_USER: ${POSTGRES_USER:?нет в .env}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?нет в .env}

networks:
  matli_network:
    name: matli_network

services:
  calc-server:
    build:
      context: ./calc-server
      dockerfile: ./docker/Dockerfile.dev
    ports:
      - 4000:4000
    environment:
      <<: *db-env
      POSTGRES_DB: calc
      LOG_DIR: /var/log/matli
    # Тот же лог ошибок, что на проде, — чтобы проверять его локально.
    volumes:
      - ./logs:/var/log/matli
    develop:
      watch:
        - action: sync
          path: ./calc-server/src
          target: /usr/calc-server/src
          ignore:
            - node_modules/
            - dist/
        - action: rebuild
          path: ./calc-server/package.json
        - action: rebuild
          path: ./calc-server/tsconfig.json
        - action: rebuild
          path: ./calc-server/nest-cli.json
        - action: rebuild
          path: ./calc-server/docker
    depends_on:
      - db

  order-server:
    build:
      context: ./order-server
      dockerfile: ./docker/Dockerfile.dev
    ports:
      - 4100:4100
    environment:
      <<: *db-env
      POSTGRES_DB: order
      LOG_DIR: /var/log/matli
    volumes:
      # Тот же лог ошибок, что на проде, — чтобы проверять его локально, а не только там.
      - ./logs:/var/log/matli
    develop:
      watch:
        - action: sync
          path: ./order-server/src
          target: /usr/order-server/src
          ignore:
            - node_modules/
            - dist/
        - action: rebuild
          path: ./order-server/package.json
        - action: rebuild
          path: ./order-server/tsconfig.json
        - action: rebuild
          path: ./order-server/nest-cli.json
        - action: rebuild
          path: ./order-server/docker
        - action: rebuild
          path: ./order-server/drizzle
    depends_on:
      db:
        # миграция первым делом стучится в базу (и заводит её, если нет)
        condition: service_healthy

  user-server:
    build:
      context: ./user-server
      dockerfile: ./docker/Dockerfile.dev
    ports:
      - 4200:4200
    environment:
      <<: *db-env
      POSTGRES_DB: user
      LOG_DIR: /var/log/matli
      JWT_SECRET: ${JWT_SECRET:?нет в .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-}
      DEFAULT_ADMIN_LOGIN: ${DEFAULT_ADMIN_LOGIN:-}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-}
      DEFAULT_ADMIN_FIRST_NAME: ${DEFAULT_ADMIN_FIRST_NAME:-}
    # Тот же лог ошибок, что на проде, — чтобы проверять его локально.
    volumes:
      - ./logs:/var/log/matli
    develop:
      watch:
        - action: sync
          path: ./user-server/src
          target: /usr/user-server/src
          ignore:
            - node_modules/
            - dist/
        - action: rebuild
          path: ./user-server/package.json
        - action: rebuild
          path: ./user-server/tsconfig.json
        - action: rebuild
          path: ./user-server/nest-cli.json
        - action: rebuild
          path: ./user-server/docker
        - action: rebuild
          path: ./user-server/drizzle
    depends_on:
      db:
        # миграция первым делом стучится в базу (и заводит её, если нет)
        condition: service_healthy

  dictionary-server:
    build:
      context: ./dictionary-server
      dockerfile: ./docker/Dockerfile.dev
    ports:
      - 4300:4300
    environment:
      <<: *db-env
      POSTGRES_DB: dictionary
      LOG_DIR: /var/log/matli
    # Тот же лог ошибок, что на проде, — чтобы проверять его локально.
    volumes:
      - ./logs:/var/log/matli
    develop:
      watch:
        - action: sync
          path: ./dictionary-server/src
          target: /usr/dictionary-server/src
          ignore:
            - node_modules/
            - dist/
        - action: rebuild
          path: ./dictionary-server/package.json
        - action: rebuild
          path: ./dictionary-server/tsconfig.json
        - action: rebuild
          path: ./dictionary-server/nest-cli.json
        - action: rebuild
          path: ./dictionary-server/docker
        # Новая миграция из db:generate — в образ и на старт контейнера.
        - action: rebuild
          path: ./dictionary-server/drizzle
    depends_on:
      db:
        # именно готовности: миграции стучатся в базу первым делом
        # и без этого падают на ещё не поднявшемся Postgres
        condition: service_healthy

  warehouse-server:
    build:
      context: ./warehouse-server
      dockerfile: ./docker/Dockerfile.dev
    ports:
      - 4400:4400
    environment:
      <<: *db-env
      POSTGRES_DB: warehouse
      LOG_DIR: /var/log/matli
    # Тот же лог ошибок, что на проде, — чтобы проверять его локально.
    volumes:
      - ./logs:/var/log/matli
    develop:
      watch:
        - action: sync
          path: ./warehouse-server/src
          target: /usr/warehouse-server/src
          ignore:
            - node_modules/
            - dist/
        - action: rebuild
          path: ./warehouse-server/package.json
        - action: rebuild
          path: ./warehouse-server/tsconfig.json
        - action: rebuild
          path: ./warehouse-server/nest-cli.json
        - action: rebuild
          path: ./warehouse-server/docker
        - action: rebuild
          path: ./warehouse-server/drizzle
    depends_on:
      db:
        # миграция первым делом стучится в базу (и заводит её, если нет)
        condition: service_healthy

  company-server:
    build:
      context: ./company-server
      dockerfile: ./docker/Dockerfile.dev
    ports:
      - 4500:4500
    environment:
      <<: *db-env
      POSTGRES_DB: company
      LOG_DIR: /var/log/matli
    # Тот же лог ошибок, что на проде, — чтобы проверять его локально.
    volumes:
      - ./logs:/var/log/matli
    develop:
      watch:
        - action: sync
          path: ./company-server/src
          target: /usr/company-server/src
          ignore:
            - node_modules/
            - dist/
        - action: rebuild
          path: ./company-server/package.json
        - action: rebuild
          path: ./company-server/tsconfig.json
        - action: rebuild
          path: ./company-server/nest-cli.json
        - action: rebuild
          path: ./company-server/docker
        - action: rebuild
          path: ./company-server/drizzle
    depends_on:
      db:
        # миграция первым делом стучится в базу (и заводит её, если нет)
        condition: service_healthy

  ionic-client:
    build:
      context: ./ionic-client
      dockerfile: ./docker/Dockerfile.dev
    ports:
      - 5173:5173
    develop:
      watch:
        - action: sync
          path: ./ionic-client
          target: /usr/app
          ignore:
            - node_modules/
    depends_on:
      - db

  admin-server:
    # Админка разработчика: читает все базы напрямую под read-only ролью
    # (db/init/02-admin-readonly.sh), вход — ADMIN из user-server. Мимо nginx.
    build:
      context: ./admin-server
      dockerfile: ./docker/Dockerfile.dev
    ports:
      - 4600:4600
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      ADMIN_DB_USER: ${ADMIN_DB_USER:-}
      ADMIN_DB_PASSWORD: ${ADMIN_DB_PASSWORD:-}
      USER_SERVER_URL: http://user-server:4200/user/api/v1
    develop:
      watch:
        - action: sync
          path: ./admin-server/src
          target: /usr/admin-server/src
          ignore:
            - node_modules/
            - dist/
        - action: rebuild
          path: ./admin-server/package.json
        - action: rebuild
          path: ./admin-server/tsconfig.json
        - action: rebuild
          path: ./admin-server/nest-cli.json
        - action: rebuild
          path: ./admin-server/docker
    depends_on:
      db:
        condition: service_healthy
      user-server:
        condition: service_started

  admin-client:
    build:
      context: ./admin-client
      dockerfile: ./docker/Dockerfile.dev
    ports:
      - 8090:8090
    environment:
      - ADMIN_API_URL=http://admin-server:4600
    develop:
      watch:
        - action: sync
          path: ./admin-client/src
          target: /usr/admin-client/src
        - action: rebuild
          path: ./admin-client/package.json
        - action: rebuild
          path: ./admin-client/vite.config.ts
        - action: rebuild
          path: ./admin-client/docker
    depends_on:
      - admin-server

  nginx:
    # Токен user-server проверяет nginx (nginx/njs/auth.js) и передаёт сервисам X-User-*.
    # Секрет, кроме него, знает только user-server — он токены выпускает.
    environment:
      JWT_SECRET: ${JWT_SECRET:?нет в .env}
    # Второй error_log из main.conf — в общий каталог поломок. Без монтирования
    # nginx не поднимется: путь из конфига обязан существовать.
    volumes:
      - ./logs:/var/log/matli
    build:
      context: ./nginx
      dockerfile: ./Dockerfile.dev
    ports:
      - "80:80"
    depends_on:
      - ionic-client
      - calc-server
      - order-server
      - user-server
      - dictionary-server
      - warehouse-server
      - company-server
      - db

  db:
    # Версия закреплена намеренно: с незакреплённым postgres очередной pull приносит
    # новую мажорную версию, которая не читает старый каталог данных.
    image: postgres:18-alpine
    restart: always
    user: postgres
    # ADMIN_DB_USER/ADMIN_DB_PASSWORD — для read-only роли админки (db/init/02-admin-readonly.sh).
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?нет в .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?нет в .env}
      POSTGRES_DB: calc
      ADMIN_DB_USER: ${ADMIN_DB_USER:-}
      ADMIN_DB_PASSWORD: ${ADMIN_DB_PASSWORD:-}
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      # postgres 18+ ждёт монтирование каталогом выше, а не в /data
      - matli_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20

  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080
    depends_on:
      - db

volumes:
  matli_pgdata:
